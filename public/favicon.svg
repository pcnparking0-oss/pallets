<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="em" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)" stroke="#10b981" stroke-width="2.2" filter="url(#glow)"/>
  
  <!-- Subtle Internal Radial Gradient Ring -->
  <circle cx="32" cy="32" r="26" fill="#10b981" fill-opacity="0.06"/>

  <!-- Euro Pallet Liquidation Cargo Lot -->
  <!-- Main Overstock Lot Box -->
  <rect x="13" y="11" width="38" height="26" rx="4" fill="url(#em)"/>
  
  <!-- Heavy Security Packaging Bands -->
  <rect x="22" y="11" width="3.5" height="26" fill="#047857" opacity="0.6"/>
  <rect x="38.5" y="11" width="3.5" height="26" fill="#047857" opacity="0.6"/>
  
  <!-- Gold Verified Liquidation Seal in Center of Pallet Lot -->
  <circle cx="32" cy="24" r="8.5" fill="#020617" stroke="url(#gold)" stroke-width="1.8"/>
  
  <!-- Euro Symbol € on Seal -->
  <path d="M34.5 21 C32.5 20.4 30 21.5 30 24 C30 26.5 32.5 27.6 34.5 27" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="28.5" y1="23.1" x2="33.5" y2="23.1" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="28.5" y1="24.9" x2="33" y2="24.9" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Timber Euro Pallet Base Structure -->
  <!-- Top Deck Board Slab -->
  <rect x="9" y="39" width="46" height="4.5" rx="1.5" fill="#64748b" stroke="#334155" stroke-width="0.6"/>
  
  <!-- 3 Heavy Duty Wooden Spacer Blocks -->
  <rect x="11" y="44.5" width="7.5" height="5" rx="1" fill="#475569"/>
  <rect x="28.25" y="44.5" width="7.5" height="5" rx="1" fill="#475569"/>
  <rect x="45.5" y="44.5" width="7.5" height="5" rx="1" fill="#475569"/>
  
  <!-- Bottom Runner Skids -->
  <rect x="9" y="50.5" width="46" height="3.5" rx="1.2" fill="#334155"/>

  <!-- Active Status Indicator Dot (Top Right) -->
  <circle cx="53" cy="11" r="3.5" fill="#10b981" stroke="#020617" stroke-width="1.5"/>
</svg>
